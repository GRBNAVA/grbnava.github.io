const lista = document.getElementById("lista-games");

function limparNomeBusca(nome){
return nome
.replace(/\b(64 BITS|UPDATE|ONLINE|GOTY|Remake|Remastered|Collection|Komplete Edition)\b/gi, "")
.replace(/^CoD:/i, "Call of Duty")
.replace(/^GTA:/i, "Grand Theft Auto")
.replace(/^FNAF:/i, "Five Nights at Freddy's")
.replace(/:/g, " ")
.replace(/\s+/g, " ")
.trim();
}

async function carregarCapaJogo(nomeJogo, elementoCapa){
const chaveCache = "rawg_v2_" + nomeJogo;
const salva = localStorage.getItem(chaveCache);

if(salva){
if(salva !== "sem_foto"){
elementoCapa.innerHTML = `<img src="${salva}" alt="Capa ${nomeJogo}" loading="lazy">`;
}
return;
}

try{
const termoBusca = encodeURIComponent(limparNomeBusca(nomeJogo));
const resp = await fetch(`https://rawg.io{RAWG_KEY}&search=${termoBusca}&page_size=1`);
const dados = await resp.json();
const imagem = dados.results && dados.results[0] && dados.results[0].background_image;

if(imagem){
localStorage.setItem(chaveCache, imagem);
elementoCapa.innerHTML = `<img src="${imagem}" alt="Capa ${nomeJogo}" loading="lazy">`;
}else{
localStorage.setItem(chaveCache, "sem_foto");
}
}catch(e){}
}

const observadorCapas = new IntersectionObserver((entradas, obs) => {
entradas.forEach(entrada => {
if(entrada.isIntersecting){
const capa = entrada.target;
carregarCapaJogo(capa.dataset.jogo, capa);
obs.unobserve(capa);
}
});
}, { rootMargin: "300px" });

function mostrarJogos(filtro = ""){
lista.innerHTML = "";
const termo = filtro.trim().toLowerCase();
let total = 0;

jogos.forEach(jogo => {
if(jogo.toLowerCase().includes(termo)){
const card = document.createElement("article");
card.className = "card";
card.innerHTML = `
<div class="capa" data-jogo="${jogo}">🎮</div>
<div class="conteudo">
<span class="etiqueta">GAME • CATÁLOGO</span>
<h3>${jogo}</h3>
<p>Disponível na listagem do catálogo OptiJogos.</p>
<div class="info">Consulte os requisitos e opções de download no catálogo.</div>
<a class="botao" href="https://optijogos.com{encodeURIComponent(jogo)}" target="_blank" rel="noopener noreferrer">BUSCAR JOGO</a>
</div>
`;
lista.appendChild(card);
observadorCapas.observe(card.querySelector(".capa"));
total++;
}
});

contador.textContent = "Mostrando " + total + " jogo(s)";
}

busca.addEventListener("input", e => mostrarJogos(e.target.value));
mostrarJogos();
