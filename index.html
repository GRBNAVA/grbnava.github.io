<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Minecraft Compacto: versão leve, gratuita e direta para baixar.">
<title>Minecraft — Relíquias do Gil</title>

<style>
:root {
  --verde: #19c37d;
  --laranja: #ff8a24;
  --azul: #2589ff;
  --fundo: #101820;
  --cartao: #192630;
  --texto: #f4f7fa;
  --suave: #b5c2cc;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  line-height: 1.6;
}

/* CABEÇALHO */

header {
  min-height: 70px;
  padding: 15px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  background: #101820;
  border-bottom: 1px solid #293944;
  position: relative;
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span:nth-child(1) { color: var(--verde); }
.logo span:nth-child(2) { color: var(--laranja); }
.logo span:nth-child(3) { color: var(--azul); }

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

nav a:hover {
  color: var(--verde);
}

/* CAPA MINECRAFT */

.capa-minecraft {
  height: 520px;
  min-height: 420px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.slides-minecraft {
  position: absolute;
  inset: 0;
  z-index: -2;
}

.slide-mc {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 0.9s ease-in-out;
  transform: scale(1.08);
}

.slide-mc.ativo {
  opacity: 1;
  transform: scale(1);
}

/* 🖼️ IMAGENS DO MINECRAFT */
.slide-mc:nth-child(1) {
  background-image: url("https://images.unsplash.com/photo-1612294037696-25c119502240?w=1600&h=900&fit=crop");
}

.slide-mc:nth-child(2) {
  background-image: url("https://images.unsplash.com/photo-1587202372521-414f5d1b2944?w=1600&h=900&fit=crop");
}
